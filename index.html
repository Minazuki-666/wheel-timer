<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel Timer</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕒</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>🕒 Wheel Timer</h1>
            <!-- <p class="subtitle">マウスホイールで時間調整</p> -->
        </header>

        <main>
            <!-- タイマー表示部分 -->
            <section class="timer-display">
                <div class="time-display" id="timeDisplay">00:00:00</div>
            </section>
            <!-- 時間設定部分 -->
            <section class="time-input">
                <h2 id="statusDisplay">時間設定（マウスホイールで調整）</h2>
                <div class="time-input-container">
                    <!-- 時間 -->
                    <div class="time-unit">
                        <label>時間</label>
                        <div class="time-value" id="hoursContainer" data-unit="hours">
                            <span class="value" id="hours">0</span>
                            <div class="controls">
                                <button class="up-btn" onclick="adjustTime('hours', 1)">▲</button>
                                <button class="down-btn" onclick="adjustTime('hours', -1)">▼</button>
                            </div>
                        </div>
                    </div>

                    <div class="colon">:</div>

                    <!-- 分 -->
                    <div class="time-unit">
                        <label>分</label>
                        <div class="time-value" id="minutesContainer" data-unit="minutes">
                            <span class="value" id="minutes">0</span>
                            <div class="controls">
                                <button class="up-btn" onclick="adjustTime('minutes', 1)">▲</button>
                                <button class="down-btn" onclick="adjustTime('minutes', -1)">▼</button>
                            </div>
                        </div>
                    </div>

                    <div class="colon">:</div>

                    <!-- 秒 -->
                    <div class="time-unit">
                        <label>秒</label>
                        <div class="time-value" id="secondsContainer" data-unit="seconds">
                            <span class="value" id="seconds">0</span>
                            <div class="controls">
                                <button class="up-btn" onclick="adjustTime('seconds', 1)">▲</button>
                                <button class="down-btn" onclick="adjustTime('seconds', -1)">▼</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- クイック設定ボタン -->
            <section class="quick-settings">
                <h2>クイック設定（マウスクリック）</h2>
                <div class="quick-buttons">
                    <button onclick="setQuickTime(30)">30秒</button>
                    <button onclick="setQuickTime(600)">10分</button>
                    <button onclick="setQuickTime(900)">15分</button>
                    <button onclick="setQuickTime(1800)">30分</button>
                </div>
            </section>

            <!-- コントロールボタン -->
            <section class="control-buttons">
                <h2>マウス操作</h2>
                <div class="button-container">
                    <button id="startBtn" class="control-btn start-btn" onclick="startTimer()">
                        ▶ スタート
                    </button>
                    <button id="pauseBtn" class="control-btn pause-btn" onclick="pauseTimer()" disabled>
                        ⏸ 一時停止
                    </button>
                    <button id="resetBtn" class="control-btn reset-btn" onclick="resetTimer()">
                        🔄 リセット
                    </button>
                </div>
                <!-- <p class="control-hint">すべてマウスクリックで操作できます</p> -->
            </section>
        </main>

        <!-- デバッグ情報（オプション） -->
        <section class="debug-section" id="debugSection" style="display: none;">
            <h3>デバッグ情報</h3>
            <div id="debugLog"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
